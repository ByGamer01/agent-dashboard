<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 3D Habitat</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{overflow:hidden;background:#050816;font-family:'Courier New',monospace}
  canvas{display:block}
  #hud{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    z-index:5;color:rgba(236,252,255,.72);font-size:.62rem;letter-spacing:.42em;
    text-transform:uppercase;pointer-events:none;text-shadow:0 0 22px rgba(34,211,238,.75)
  }
  #mode{
    position:fixed;left:18px;bottom:16px;z-index:5;color:rgba(236,252,255,.52);
    font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;pointer-events:none
  }
  .label{
    color:#ecfeff;font-size:11px;font-weight:700;letter-spacing:.08em;text-align:center;
    text-shadow:0 0 8px rgba(0,0,0,.9),0 0 16px currentColor;white-space:nowrap;pointer-events:none
  }
  .bubble{
    max-width:250px;padding:8px 10px;border:2px solid currentColor;border-radius:9px;
    background:rgba(3,7,18,.88);font-size:10px;line-height:1.35;font-weight:800;
    color:#fff;box-shadow:0 0 20px currentColor;text-shadow:0 0 8px rgba(255,255,255,.55);
    pointer-events:none
  }
  #conn-status{
    position:fixed;bottom:16px;right:18px;z-index:10;font-size:.55rem;
    letter-spacing:.15em;pointer-events:none;transition:color .4s,opacity .4s
  }
  #conn-status.online{color:rgba(52,211,153,.7)}
  #conn-status.offline{color:rgba(239,68,68,.5)}
  #conn-status.reconnecting{color:rgba(251,191,36,.5)}
  #offline-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;
    background:rgba(5,8,22,.85);display:flex;align-items:center;justify-content:center;
    flex-direction:column;opacity:0;pointer-events:none;transition:opacity .6s ease
  }
  #offline-overlay.visible{opacity:1}
  #offline-overlay .sym{font-size:3rem;color:rgba(239,68,68,.6);margin-bottom:12px}
  #offline-overlay .msg{font-size:.7rem;color:rgba(239,68,68,.5);letter-spacing:.2em}
  #nav{
    position:fixed;bottom:42px;left:50%;transform:translateX(-50%);
    z-index:5;display:flex;gap:10px;align-items:center;
  }
  #nav button{
    background:rgba(3,7,18,.82);border:1.5px solid rgba(34,211,238,.55);
    color:rgba(236,252,255,.85);font-family:'Courier New',monospace;
    font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
    padding:6px 14px;border-radius:6px;cursor:pointer;
    transition:border-color .2s,box-shadow .2s,color .2s;
  }
  #nav button:hover{
    border-color:rgba(34,211,238,1);box-shadow:0 0 12px rgba(34,211,238,.5);
    color:#ecfeff;
  }
  #nav button.overview{
    border-color:rgba(249,115,22,.55);
  }
  #nav button.overview:hover{
    border-color:rgba(249,115,22,1);box-shadow:0 0 12px rgba(249,115,22,.5);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three.module.js",
    "three/addons/": "/vendor/three/"
  }
}
</script>
</head>
<body>
<div id="hud">Agent Habitat // Web3D</div>
<div id="mode">Click room to enter · click outside to overview</div>
<div id="conn-status" class="online">● ONLINE</div>
<div id="offline-overlay"><div class="sym">⚠</div><div class="msg">CONNECTION LOST — RECONNECTING…</div></div>
<div id="nav"></div>
<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050816);
scene.fog=new THREE.Fog(0x050816,18,42);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.35;
document.body.appendChild(renderer.domElement);

const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.position='fixed';
labelRenderer.domElement.style.inset='0';
labelRenderer.domElement.style.pointerEvents='none';
document.body.appendChild(labelRenderer.domElement);

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const clickableRooms=[];
const clickableDoors=[];
const clock=new THREE.Clock();

const CONFIGS={
  hermes:{name:'Hermes',kind:'cat',color:0x00ff9d,shade:0x00a86b},
  claude:{name:'Claude Code',kind:'fox',color:0xff7a2f,shade:0xb83a12},
  codex:{name:'Codex',kind:'owl',color:0xb56cff,shade:0x6d28d9},
  ollama:{name:'Ollama',kind:'llama',color:0x38bdf8,shade:0x0f766e}
};
const FALLBACK_MESSAGES={
  hermes:['rastreando tareas','sincronizando memoria','olfateando logs','preparando ruta'],
  claude:['pensando respuesta','ordenando contexto','escribiendo plan','comparando opciones'],
  codex:['editando archivos','leyendo proyecto','probando cambios','revisando diffs'],
  ollama:['calentando modelo local','sirviendo embeddings','respondiendo en local','cargando pesos']
};

const rooms=[
  {id:'kitchen',name:'Cocina',x:-3.05,z:-2.05,w:5.7,d:3.7,color:0x14b8a6,accent:0xf97316},
  {id:'lab',name:'Laboratorio',x:3.05,z:-2.05,w:5.7,d:3.7,color:0x8b5cf6,accent:0x22d3ee},
  {id:'lounge',name:'Salon',x:-3.05,z:2.05,w:5.7,d:3.7,color:0xf59e0b,accent:0x00ff9d},
  {id:'server',name:'Sala Servidor',x:3.05,z:2.05,w:5.7,d:3.7,color:0x2563eb,accent:0xff4fd8}
];
const roomById=Object.fromEntries(rooms.map(r=>[r.id,r]));
const roomLinks={
  kitchen:['lab','lounge'],
  lab:['kitchen','server'],
  lounge:['kitchen','server'],
  server:['lab','lounge']
};
const roomExits={
  kitchen:{lab:new THREE.Vector3(0,.22,-2.05),lounge:new THREE.Vector3(-3.05,.22,0)},
  lab:{kitchen:new THREE.Vector3(0,.22,-2.05),server:new THREE.Vector3(3.05,.22,0)},
  lounge:{kitchen:new THREE.Vector3(-3.05,.22,0),server:new THREE.Vector3(0,.22,2.05)},
  server:{lab:new THREE.Vector3(3.05,.22,0),lounge:new THREE.Vector3(0,.22,2.05)}
};

let selectedRoom=null;
const cameraTarget={pos:new THREE.Vector3(0,10,10),look:new THREE.Vector3(0,0,0)};
// Orbit controls for overview mode
let camTheta=0,camPhi=1.05,camRadius=12.8;
let isOrbiting=false,orbitPrev={x:0,y:0};
const agents=new Map();
const interactionLines=[];
const navEl=document.getElementById('nav');
const ROOM_LABELS={kitchen:'Cocina',lab:'Laboratorio',lounge:'Salon',server:'Sala Servidor'};

initLights();
buildHouse();
buildAppliances();
setOverview();
camera.position.copy(cameraTarget.pos);
camera.lookAt(cameraTarget.look);
connect();
animate();

function initLights(){
  scene.add(new THREE.HemisphereLight(0xbbefff,0x1e1438,2.8));
  const key=new THREE.DirectionalLight(0xffffff,3.2);
  key.position.set(-5,10,7);key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  scene.add(key);
  const cyan=new THREE.PointLight(0x22d3ee,2.2,18);cyan.position.set(-4,3,-4);scene.add(cyan);
  const magenta=new THREE.PointLight(0xc084fc,1.8,18);magenta.position.set(4,3,4);scene.add(magenta);
}

function buildHouse(){
  const base=new THREE.Mesh(
    new THREE.BoxGeometry(12.8,.22,8.8),
    new THREE.MeshStandardMaterial({color:0x0f172a,roughness:.45,metalness:.1})
  );
  base.position.y=-.12;base.receiveShadow=true;scene.add(base);

  rooms.forEach(room=>{
    const floor=new THREE.Mesh(
      new THREE.BoxGeometry(room.w,.12,room.d),
      new THREE.MeshStandardMaterial({color:room.color,roughness:.48,metalness:.12,emissive:room.color,emissiveIntensity:.08})
    );
    floor.position.set(room.x,0,room.z);
    floor.userData.roomId=room.id;
    floor.receiveShadow=true;
    scene.add(floor);clickableRooms.push(floor);

    const grid=new THREE.GridHelper(Math.max(room.w,room.d),8,room.accent,0xffffff);
    grid.position.set(room.x,.07,room.z);grid.material.opacity=.18;grid.material.transparent=true;scene.add(grid);

    const plaque=makeTextLabel(room.name.toUpperCase(),'label',`#${room.accent.toString(16).padStart(6,'0')}`);
    plaque.position.set(room.x,.35,room.z-room.d*.36);scene.add(plaque);

    addRoomLight(room);
  });

  addWall(0,1.05,-4.4,12.8,.28,.35,0x1e293b);
  addWall(0,1.05,4.4,12.8,.28,.35,0x1e293b);
  addWall(-6.4,1.05,0,.28,.28,8.8,0x1e293b);
  addWall(6.4,1.05,0,.28,.28,8.8,0x1e293b);
  // Cross walls with door gaps (wall segments instead of one solid block)
  // x=0 wall (left↔right divider): segments with gap at kitchen↔lab door (z=-2.05)
  // and lounge↔server door (z=2.05)
  addWall(0,1.05,-3.55,.24,.28,1.7,0x334155); // front segment: z=-4.4 to -2.7
  addWall(0,1.05,0,.24,.28,2.7,0x334155);     // center segment: z=-1.35 to 1.35
  addWall(0,1.05,3.55,.24,.28,1.7,0x334155);  // back segment: z=2.7 to 4.4
  // z=0 wall (front↔back divider): segments with gap at kitchen↔lounge door (x=-3.05)
  // and lab↔server door (x=3.05)
  addWall(-5.025,1.05,0,1.75,.28,.24,0x334155); // left segment: x=-6.4 to -3.65
  addWall(0,1.05,0,4.7,.28,.24,0x334155);       // center segment: x=-2.35 to 2.35
  addWall(5.025,1.05,0,1.75,.28,.24,0x334155);  // right segment: x=2.35 to 6.4

  // Door arch glows at each gap
  addDoorGlow(0,.15,-2.05,.18,.45,0x22d3ee,'kitchen','lab');
  addDoorGlow(0,.15,2.05,.18,.45,0x22d3ee,'lounge','server');
  addDoorGlow(-3.05,.15,0,.45,.18,0xf97316,'kitchen','lounge');
  addDoorGlow(3.05,.15,0,.45,.18,0xf97316,'lab','server');

  const roof=new THREE.Mesh(
    new THREE.ConeGeometry(7.9,2.3,4),
    new THREE.MeshStandardMaterial({color:0x7c2d12,roughness:.42,metalness:.05,emissive:0x431407,emissiveIntensity:.08})
  );
  roof.position.set(0,2.35,0);roof.rotation.y=Math.PI*.25;roof.castShadow=true;scene.add(roof);
  roof.visible=false;
}

function addWall(x,y,z,w,h,d,color){
  const wall=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.6,metalness:.08}));
  wall.position.set(x,y,z);wall.castShadow=true;wall.receiveShadow=true;scene.add(wall);
}
function addDoorGlow(x,y,z,w,d,color,roomA,roomB){
  const door=new THREE.Mesh(
    new THREE.BoxGeometry(w,.08,d),
    new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.85,transparent:true,opacity:.78})
  );
  door.position.set(x,y,z);
  door.userData.doorRoomA=roomA;
  door.userData.doorRoomB=roomB;
  scene.add(door);
  clickableDoors.push(door);
}
function addRoomLight(room){
  const lamp=new THREE.PointLight(room.accent,1.8,6);
  lamp.position.set(room.x,2.3,room.z);scene.add(lamp);
}

function buildAppliances(){
  buildFridge(-4.7,-3.2);
  buildWasher(-3.6,-3.25);
  buildOven(1.7,-3.25);
  buildMicrowave(2.9,-3.25);
  buildSofa(-4.2,3.1);
  buildCoffeeTable(-2.7,2.15);
  buildServerRack(4.85,3.1);
  buildTerminal(3.55,1.6);
  buildOllamaStation(4.45,1.55);
}
function mat(color,emissive=0x000000,intensity=0){
  return new THREE.MeshStandardMaterial({color,roughness:.36,metalness:.18,emissive,emissiveIntensity:intensity});
}
function box(x,y,z,w,h,d,color,emissive=0x000000,intensity=0){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,emissive,intensity));
  mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
  return mesh;
}
function cyl(x,y,z,r,h,color,rotX=0,emissive=0x000000,intensity=0){
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,32),mat(color,emissive,intensity));
  mesh.position.set(x,y,z);mesh.rotation.x=rotX;mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
  return mesh;
}
function tag3d(text,x,y,z,color='#ecfeff'){
  const tag=makeTextLabel(text,'label',color);
  tag.position.set(x,y,z);scene.add(tag);
  return tag;
}
function addGlow(x,y,z,color,intensity=.75,dist=2.1){
  const light=new THREE.PointLight(color,intensity,dist);
  light.position.set(x,y,z);scene.add(light);
}
function buildFridge(x,z){
  box(x,.68,z,.78,1.36,.58,0xdff9ff,0x67e8f9,.05);
  box(x-.205,.72,z+.301,.34,1.16,.03,0xbff4ff);
  box(x+.205,.72,z+.301,.34,1.16,.03,0xeafcff);
  box(x,.19,z+.305,.73,.12,.04,0x0f172a,0x22d3ee,.35);
  box(x-.39,.72,z+.34,.035,.72,.035,0x0f172a);
  box(x+.39,.72,z+.34,.035,.72,.035,0x0f172a);
  box(x+.11,.92,z+.345,.18,.12,.025,0x0b1222,0x38bdf8,.7);
  for(let i=0;i<5;i++) box(x-.22+i*.11,1.26,z+.34,.045,.035,.018,[0xf97316,0x22d3ee,0xa3e635,0xf472b6,0xfacc15][i],0xffffff,.15);
  box(x,.04,z+.02,.86,.08,.66,0x0f172a);
  addGlow(x,.95,z+.55,0x67e8f9,.9,2.4);
  tag3d('NEVERA',x,1.48,z,'#67e8f9');
}
function buildWasher(x,z){
  box(x,.43,z,.72,.78,.56,0xe0fff2,0xa7f3d0,.05);
  const door=cyl(x,.43,z+.305,.23,.055,0x0f172a,Math.PI/2,0x60a5fa,.35);
  const glass=cyl(x,.43,z+.34,.17,.035,0x7dd3fc,Math.PI/2,0x38bdf8,.5);
  box(x-.22,.79,z+.315,.18,.08,.035,0x0f172a,0x22d3ee,.5);
  for(let i=0;i<4;i++) cyl(x+.02+i*.09,.8,z+.335,.025,.025,[0x22d3ee,0xf97316,0xa3e635,0xf472b6][i],Math.PI/2,0xffffff,.2);
  box(x-.28,.04,z,.16,.08,.48,0x0f172a);box(x+.28,.04,z,.16,.08,.48,0x0f172a);
  addGlow(x,.78,z+.52,0xa7f3d0,.7,2.1);
  tag3d('LAVADORA',x,1.0,z,'#a7f3d0');
}
function buildOven(x,z){
  box(x,.42,z,.9,.78,.58,0x92400e,0xf59e0b,.06);
  box(x,.42,z+.315,.68,.42,.045,0x111827,0xf97316,.25);
  box(x,.42,z+.345,.48,.26,.025,0x0ea5e9,0x38bdf8,.18);
  box(x,.78,z+.325,.76,.12,.04,0x1f2937);
  for(let i=0;i<4;i++) cyl(x-.27+i*.18,.81,z+.355,.035,.035,[0xfacc15,0xf97316,0xfacc15,0xf97316][i],Math.PI/2,0xffffff,.18);
  for(const dx of[-.26,.26]) for(const dz of[-.18,.08]) cyl(x+dx,.86,z+dz,.12,.025,0x111827,0,0xf97316,.15);
  box(x,.04,z+.02,.96,.08,.66,0x0f172a);
  addGlow(x,.87,z+.25,0xf97316,.85,2.3);
  tag3d('HORNO',x,1.02,z,'#f59e0b');
}
function buildMicrowave(x,z){
  box(x,.72,z,.78,.42,.44,0xdb2777,0xf472b6,.08);
  box(x-.11,.72,z+.245,.39,.25,.03,0x111827,0x38bdf8,.22);
  box(x+.25,.75,z+.248,.12,.22,.028,0x0f172a);
  for(let i=0;i<3;i++) box(x+.25,.82-i*.07,z+.27,.055,.025,.02,[0x22d3ee,0xfacc15,0xa3e635][i],0xffffff,.25);
  box(x+.34,.72,z+.27,.035,.24,.025,0x020617);
  addGlow(x,.91,z+.42,0xf472b6,.7,2);
  tag3d('MICRO',x,1.02,z,'#f472b6');
}
function buildSofa(x,z){
  box(x,.28,z,1.7,.38,.68,0xbe123c,0xfb7185,.05);
  box(x,.58,z-.23,1.76,.54,.22,0xfb7185,0xfb7185,.08);
  for(let i=0;i<3;i++) box(x-.55+i*.55,.52,z+.16,.48,.22,.38,[0xfb7185,0xf43f5e,0xff8fab][i],0xfb7185,.05);
  for(const dx of[-.74,.74]) box(x+dx,.45,z,.18,.48,.68,0x9f1239);
  for(const dx of[-.68,.68]) for(const dz of[-.25,.28]) box(x+dx,.07,z+dz,.08,.14,.08,0x111827);
  addGlow(x,.72,z+.1,0xfb7185,.45,2.4);
  tag3d('SOFA',x,.98,z,'#fb7185');
}
function buildCoffeeTable(x,z){
  box(x,.34,z,.96,.08,.72,0xfacc15,0xfacc15,.08);
  box(x,.39,z,.8,.035,.56,0xffffff,0x22d3ee,.18);
  for(const dx of[-.38,.38]) for(const dz of[-.26,.26]) box(x+dx,.16,z+dz,.06,.32,.06,0x451a03);
  cyl(x-.24,.48,z-.02,.08,.18,0x0f172a,0,0x22d3ee,.3);
  cyl(x-.24,.58,z-.02,.11,.025,0x67e8f9,0,0x38bdf8,.25);
  box(x+.18,.49,z+.04,.24,.04,.16,0x111827,0xa855f7,.28);
  tag3d('MESA',x,.68,z,'#facc15');
}
function buildServerRack(x,z){
  box(x,.72,z,.86,1.34,.58,0x0f172a,0x60a5fa,.04);
  for(let i=0;i<7;i++){
    const yy=.18+i*.16;
    box(x,yy,z+.315,.72,.08,.035,0x1e293b);
    box(x-.26,yy,z+.34,.05,.025,.018,i%2?0x22c55e:0x38bdf8,0xffffff,.35);
    box(x+.18,yy,z+.34,.24,.018,.018,0x475569,0x60a5fa,.18);
  }
  for(const dx of[-.33,.33]) box(x+dx,.72,z+.34,.035,1.14,.035,0x94a3b8);
  addGlow(x,.88,z+.54,0x60a5fa,1.1,2.8);
  tag3d('RACK',x,1.52,z,'#60a5fa');
}
function buildTerminal(x,z){
  box(x,.28,z,.92,.18,.52,0x111827,0xa78bfa,.08);
  box(x-.24,.72,z+.08,.46,.42,.06,0x020617,0x38bdf8,.5);
  box(x+.32,.68,z+.08,.42,.34,.06,0x020617,0xa855f7,.45);
  box(x-.24,.72,z+.115,.35,.25,.02,0x0ea5e9,0x22d3ee,.5);
  box(x+.32,.68,z+.115,.31,.2,.02,0x7c3aed,0xa855f7,.45);
  box(x,.43,z+.2,.7,.05,.18,0x0f172a);
  for(let row=0;row<3;row++) for(let col=0;col<9;col++) box(x-.29+col*.07,.47,z+.13+row*.04,.04,.012,.02,0x334155,0x22d3ee,.12);
  addGlow(x,.83,z+.34,0xa78bfa,.9,2.4);
  tag3d('TERMINAL',x,1.02,z,'#a78bfa');
}
function buildOllamaStation(x,z){
  cyl(x,.34,z,.36,.56,0x0f766e,0,0x38bdf8,.12);
  cyl(x,.66,z,.26,.1,0x38bdf8,0,0x38bdf8,.8);
  for(let i=0;i<3;i++) cyl(x,.22+i*.16,z,.39,.025,[0x38bdf8,0xa7f3d0,0x22d3ee][i],0,0x38bdf8,.55);
  box(x,.42,z+.42,.5,.18,.055,0x020617,0x38bdf8,.45);
  for(let i=0;i<5;i++) box(x-.18+i*.09,.43,z+.455,.035,.035,.018,i%2?0xa7f3d0:0x38bdf8,0xffffff,.25);
  const antenna=cyl(x+.23,.92,z+.03,.025,.42,0x67e8f9,0,0x38bdf8,.35);
  cyl(x+.23,1.16,z+.03,.07,.08,0x38bdf8,0,0x38bdf8,.85);
  addGlow(x,.9,z+.45,0x38bdf8,1.1,2.4);
  tag3d('OLLAMA',x,1.16,z,'#38bdf8');
}

class AgentPet{
  constructor(uid,agentId,idx){
    const cfg=CONFIGS[agentId];
    this.uid=uid;this.agentId=agentId;this.idx=idx;this.cfg=cfg;
    this.name=cfg.name+(idx?` #${idx+1}`:'');
    this.room=rooms[idx%rooms.length].id;
    this.targetRoom=this.room;
    this.phase='wander';
    this.doorFrom=null;
    this.pos=randomPointInRoom(this.room);
    this.target=this.pos.clone();
    this.velocity=new THREE.Vector3();
    this.status='idle';
    this.lastLine='';
    this.message=FALLBACK_MESSAGES[agentId][idx%FALLBACK_MESSAGES[agentId].length];
    this.messageTimer=2+Math.random()*4;
    this.group=buildPet(cfg.kind,cfg.color,cfg.shade);
    this.group.position.copy(this.pos);
    this.group.scale.setScalar(1.5);
    scene.add(this.group);
    this.nameLabel=makeTextLabel(this.name.toUpperCase(),'label',`#${cfg.color.toString(16).padStart(6,'0')}`);
    this.nameLabel.position.set(0,.92,0);this.group.add(this.nameLabel);
    this.bubble=makeTextLabel(this.message,'bubble',`#${cfg.color.toString(16).padStart(6,'0')}`);
    this.bubble.position.set(0,1.35,0);this.group.add(this.bubble);
  }
  setStatus(status,line){
    this.status=status;
    if(line&&line!==this.lastLine){
      this.lastLine=line;
      this.message=line.slice(0,130);
      this.setBubble(this.message);
      this.messageTimer=6;
    }
  }
  setBubble(text){this.bubble.element.textContent=text;}
  pickTarget(){
    if(Math.random()<.28){
      const options=roomLinks[this.room];
      this.targetRoom=options[Math.floor(Math.random()*options.length)];
      this.phase='toDoor';
      this.doorFrom=this.room;
      this.target=doorPoint(this.room,this.targetRoom);
      this.message=`voy a ${roomById[this.targetRoom].name.toLowerCase()}`;
      this.setBubble(this.message);
      return;
    }
    this.phase='wander';
    this.target=randomPointInRoom(this.room);
  }
  update(dt,all){
    this.messageTimer-=dt;
    if(this.messageTimer<0){
      const lines=FALLBACK_MESSAGES[this.agentId];
      this.message=lines[Math.floor(Math.random()*lines.length)];
      this.setBubble(this.message);
      this.messageTimer=4+Math.random()*6;
    }
    const dist=this.pos.distanceTo(this.target);
    if(dist<.18){
      if(this.phase==='toDoor'){
        this.room=this.targetRoom;
        this.phase='fromDoor';
        this.pos.copy(enterPoint(this.doorFrom,this.room));
        this.target=randomPointInRoom(this.room);
        this.message=`entrando en ${roomById[this.room].name.toLowerCase()}`;
        this.setBubble(this.message);
      }else this.pickTarget();
    }
    const dir=this.target.clone().sub(this.pos);
    if(dir.lengthSq()>0) dir.normalize();
    const speed=this.status==='working'?1.45:this.status==='thinking'?.92:.62;
    this.velocity.lerp(dir.multiplyScalar(speed),Math.min(1,dt*2.2));

    for(const other of all){
      if(other===this||other.room!==this.room) continue;
      const away=this.pos.clone().sub(other.pos);
      const d=away.length();
      if(d>0&&d<.9) this.velocity.add(away.normalize().multiplyScalar((.9-d)*1.8));
      if(d>.9&&d<2.2&&this.status!=='idle'){
        this.message=`${other.name.split(' ')[0]}, tengo datos`;
        this.setBubble(this.message);
      }
    }

    this.pos.addScaledVector(this.velocity,dt);
    if(this.phase==='wander') constrainToRoom(this);
    this.group.position.copy(this.pos);
    this.group.rotation.y=Math.atan2(this.velocity.x,this.velocity.z);
    const bob=Math.sin(performance.now()*.006+this.idx)*.06;
    this.group.position.y=.22+bob;
    this.group.scale.setScalar(this.status==='working'?1.12:1);
  }
}

function buildPet(kind,color,shade){
  const g=new THREE.Group();
  const bodyMat=new THREE.MeshStandardMaterial({color,roughness:.38,metalness:.12,emissive:color,emissiveIntensity:.08});
  const shadeMat=new THREE.MeshStandardMaterial({color:shade,roughness:.44,metalness:.08});
  const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35});
  const black=new THREE.MeshStandardMaterial({color:0x020617,roughness:.3});
  const yellow=new THREE.MeshStandardMaterial({color:0xfacc15,roughness:.35,emissive:0xf59e0b,emissiveIntensity:.12});

  const body=new THREE.Mesh(new THREE.SphereGeometry(.36,24,18),bodyMat);body.scale.set(1.05,.9,1.15);body.castShadow=true;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.31,24,18),bodyMat);head.position.set(0,.42,.18);head.castShadow=true;g.add(head);

  if(kind==='cat'||kind==='fox'){
    addEar(g,-.18,.74,.18,bodyMat);addEar(g,.18,.74,.18,bodyMat);
    const tail=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.55,8,16),bodyMat);
    tail.position.set(-.42,.2,-.2);tail.rotation.z=.95;tail.rotation.x=.6;tail.castShadow=true;g.add(tail);
    if(kind==='fox'){
      const chest=new THREE.Mesh(new THREE.SphereGeometry(.21,18,12),white);chest.position.set(0,.28,.43);chest.scale.set(.9,1,.35);g.add(chest);
      const tip=new THREE.Mesh(new THREE.SphereGeometry(.11,16,10),white);tip.position.set(-.65,.38,-.38);g.add(tip);
    }
  }else if(kind==='owl'){
    addEar(g,-.18,.72,.18,bodyMat);addEar(g,.18,.72,.18,bodyMat);
    const wingL=new THREE.Mesh(new THREE.SphereGeometry(.2,16,10),shadeMat);wingL.position.set(-.34,.2,.03);wingL.scale.set(.45,1.15,.18);g.add(wingL);
    const wingR=wingL.clone();wingR.position.x=.34;g.add(wingR);
    const beak=new THREE.Mesh(new THREE.ConeGeometry(.08,.18,4),yellow);beak.position.set(0,.43,.5);beak.rotation.x=Math.PI*.5;g.add(beak);
  }else{
    const neck=new THREE.Mesh(new THREE.CapsuleGeometry(.11,.38,8,14),bodyMat);
    neck.position.set(0,.53,.04);neck.castShadow=true;g.add(neck);
    const muzzle=new THREE.Mesh(new THREE.SphereGeometry(.14,16,10),shadeMat);
    muzzle.position.set(0,.4,.52);muzzle.scale.set(1.15,.7,.75);g.add(muzzle);
    addEar(g,-.14,.86,.14,bodyMat);addEar(g,.14,.86,.14,bodyMat);
    const pack=new THREE.Mesh(new THREE.BoxGeometry(.38,.18,.34),shadeMat);
    pack.position.set(0,.2,-.36);pack.castShadow=true;g.add(pack);
  }

  [-.1,.1].forEach(x=>{
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,12,8),black);
    eye.position.set(x,.48,.48);g.add(eye);
    const shine=new THREE.Mesh(new THREE.SphereGeometry(.014,8,6),white);
    shine.position.set(x+.015,.495,.515);g.add(shine);
  });
  const nose=new THREE.Mesh(new THREE.SphereGeometry(.035,10,8),black);nose.position.set(0,.36,.51);g.add(nose);
  const glow=new THREE.PointLight(color,1.2,2.8);glow.position.set(0,.6,0);g.add(glow);
  return g;
}
function addEar(group,x,y,z,mat){
  const ear=new THREE.Mesh(new THREE.ConeGeometry(.11,.28,3),mat);
  ear.position.set(x,y,z);ear.rotation.x=.18;ear.castShadow=true;group.add(ear);
}

function makeTextLabel(text,cls,color){
  const el=document.createElement('div');
  el.className=cls;el.textContent=text;el.style.color=color;
  return new CSS2DObject(el);
}

function randomPointInRoom(roomId){
  const r=roomById[roomId];
  return new THREE.Vector3(
    r.x+(Math.random()-.5)*(r.w-1.6),
    .22,
    r.z+(Math.random()-.5)*(r.d-1.6)
  );
}
function constrainToRoom(agent){
  const r=roomById[agent.room],pad=agent.phase==='toDoor'?.06:.42;
  agent.pos.x=THREE.MathUtils.clamp(agent.pos.x,r.x-r.w*.5+pad,r.x+r.w*.5-pad);
  agent.pos.z=THREE.MathUtils.clamp(agent.pos.z,r.z-r.d*.5+pad,r.z+r.d*.5-pad);
}
function doorPoint(from,to){
  const a=roomById[from],b=roomById[to]||a,pad=.52;
  let x,z;
  if(a.x<b.x){x=a.x+a.w*.5-pad;z=(a.z+b.z)/2;}
  else if(a.x>b.x){x=a.x-a.w*.5+pad;z=(a.z+b.z)/2;}
  else if(a.z<b.z){x=(a.x+b.x)/2;z=a.z+a.d*.5-pad;}
  else{x=(a.x+b.x)/2;z=a.z-a.d*.5+pad;}
  return new THREE.Vector3(x,.22,z);
}
function enterPoint(from,to){
  const a=roomById[from],b=roomById[to],pad=.5;
  let x,z;
  if(a.x<b.x){x=b.x-b.w*.5+pad;z=(a.z+b.z)/2;}
  else if(a.x>b.x){x=b.x+b.w*.5-pad;z=(a.z+b.z)/2;}
  else if(a.z<b.z){x=(a.x+b.x)/2;z=b.z-b.d*.5+pad;}
  else{x=(a.x+b.x)/2;z=b.z+b.d*.5-pad;}
  return new THREE.Vector3(x,.22,z);
}
function oppositeRoom(roomId){
  return roomLinks[roomId]?.[0]||roomId;
}

function syncAgents(agentId,state){
  const needed=state.instances??0;
  const existing=[...agents.values()].filter(a=>a.agentId===agentId);
  for(let i=existing.length;i<needed;i++){
    const pet=new AgentPet(`${agentId}:${i}`,agentId,i);
    agents.set(pet.uid,pet);
  }
  for(let i=needed;i<existing.length;i++){
    scene.remove(existing[i].group);
    agents.delete(existing[i].uid);
  }
  for(let i=0;i<needed;i++){
    const pet=agents.get(`${agentId}:${i}`);
    if(pet) pet.setStatus(state.status,i===0?state.last_line:'');
  }
}
Object.keys(CONFIGS).forEach(id=>syncAgents(id,{status:'idle',last_line:'',instances:0}));

function updateInteractions(){
  interactionLines.forEach(l=>scene.remove(l));
  interactionLines.length=0;
  const list=[...agents.values()];
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
    const a=list[i],b=list[j];
    if(a.room!==b.room||a.pos.distanceTo(b.pos)>2.4) continue;
    const mat=new THREE.LineBasicMaterial({color:a.cfg.color,transparent:true,opacity:.65});
    const points=[a.pos.clone().add(new THREE.Vector3(0,.7,0)),b.pos.clone().add(new THREE.Vector3(0,.7,0))];
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),mat);
    scene.add(line);interactionLines.push(line);
  }
}

function updateNav(){
  navEl.innerHTML='';
  if(!selectedRoom) return;
  const btn0=document.createElement('button');
  btn0.className='overview';btn0.textContent='⌂ Overview';
  btn0.onclick=()=>setOverview();
  navEl.appendChild(btn0);
  roomLinks[selectedRoom].forEach(targetId=>{
    const btn=document.createElement('button');
    btn.textContent=`→ ${ROOM_LABELS[targetId]}`;
    btn.onclick=()=>enterRoom(roomById[targetId]);
    navEl.appendChild(btn);
  });
}

function setOverview(){
  selectedRoom=null;
  cameraTarget.pos.set(
    camRadius*Math.sin(camPhi)*Math.sin(camTheta),
    camRadius*Math.cos(camPhi),
    camRadius*Math.sin(camPhi)*Math.cos(camTheta)
  );
  cameraTarget.look.set(0,0,0);
  document.getElementById('mode').textContent='Arrastra para orbitar · rueda para zoom · click sala para entrar · [1-4] rooms';
  updateNav();
}
function enterRoom(room){
  selectedRoom=room.id;
  cameraTarget.pos.set(room.x,3.25,room.z+3.35);
  cameraTarget.look.set(room.x,.35,room.z);
  document.getElementById('mode').textContent=`Dentro de ${room.name} · ESC para salir · click otra habitacion para moverte`;
  updateNav();
}
let mouseDownPos=null;

addEventListener('pointerdown',e=>{
  orbitPrev={x:e.clientX,y:e.clientY};
  mouseDownPos={x:e.clientX,y:e.clientY};
});
addEventListener('pointermove',e=>{
  if(e.buttons!==1)return;
  const dx=e.clientX-orbitPrev.x,dy=e.clientY-orbitPrev.y;
  orbitPrev={x:e.clientX,y:e.clientY};
  if(selectedRoom)return; // don't orbit inside a room
  isOrbiting=true;
  camTheta-=dx*.008;
  camPhi=Math.max(.3,Math.min(Math.PI*.85,camPhi+dy*.008));
  setOverview();
});
addEventListener('pointerup',e=>{
  if(!isOrbiting&&mouseDownPos){
    const dist=Math.hypot(e.clientX-mouseDownPos.x,e.clientY-mouseDownPos.y);
    if(dist<6)onClick(e);
  }
  isOrbiting=false;
  mouseDownPos=null;
});
function onClick(event){
  pointer.x=event.clientX/innerWidth*2-1;
  pointer.y=-(event.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hitRoom=raycaster.intersectObjects(clickableRooms,false)[0];
  if(hitRoom){ enterRoom(roomById[hitRoom.object.userData.roomId]); return; }
  const hitDoor=raycaster.intersectObjects(clickableDoors,false)[0];
  if(hitDoor){
    const{doorRoomA,doorRoomB}=hitDoor.object.userData;
    const dest=(selectedRoom===doorRoomA)?doorRoomB:(selectedRoom===doorRoomB)?doorRoomA:doorRoomA;
    enterRoom(roomById[dest]);
    return;
  }
  if(!selectedRoom) setOverview();
  else setOverview();
}
navEl.addEventListener('click',e=>e.stopPropagation());
addEventListener('click',onClick);
addEventListener('keydown',e=>{
  if(e.key==='Escape') setOverview();
  if(e.key==='1') enterRoom(rooms[0]);
  if(e.key==='2') enterRoom(rooms[1]);
  if(e.key==='3') enterRoom(rooms[2]);
  if(e.key==='4') enterRoom(rooms[3]);
});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  labelRenderer.setSize(innerWidth,innerHeight);
});
addEventListener('wheel',e=>{
  e.preventDefault();
  if(selectedRoom)return;
  camRadius=Math.max(4,Math.min(35,camRadius+e.deltaY*.015));
  setOverview();
},{passive:false});
function animate(){
  const dt=Math.min(.04,clock.getDelta());
  const list=[...agents.values()];
  list.forEach(a=>a.update(dt,list));
  updateInteractions();
  camera.position.lerp(cameraTarget.pos,.045);
  const look=new THREE.Vector3();
  camera.getWorldDirection(look);
  const current=camera.position.clone().add(look);
  current.lerp(cameraTarget.look,.075);
  camera.lookAt(current);
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
  requestAnimationFrame(animate);
}

function connect(){
  setConnStatus('reconnecting');
  const ws=new WebSocket('ws://127.0.0.1:7788/ws');
  let retryDelay=1000;

  ws.onopen=()=>{
    retryDelay=1000;
    setConnStatus('online');
  };

  ws.onmessage=e=>{
    const data=JSON.parse(e.data);
    for(const[id,state]of Object.entries(data)) syncAgents(id,state);
  };

  ws.onclose=()=>{
    setConnStatus('reconnecting');
    const delay=retryDelay;
    retryDelay=Math.min(retryDelay*1.5,15000);
    setTimeout(connect,delay);
  };

  ws.onerror=()=>{
    ws.close();
  };
}

function setConnStatus(mode){
  const el=document.getElementById('conn-status');
  const overlay=document.getElementById('offline-overlay');
  el.className=mode;
  if(mode==='online'){
    el.textContent='● ONLINE';
    overlay.classList.remove('visible');
  }else if(mode==='reconnecting'){
    el.textContent='◐ RECONNECTING…';
    overlay.classList.add('visible');
  }else{
    el.textContent='○ OFFLINE';
    overlay.classList.add('visible');
  }
}
