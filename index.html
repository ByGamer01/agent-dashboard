<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 3D Habitat</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{overflow:hidden;background:#050816;font-family:'Courier New',monospace}
  canvas{display:block}
  #hud{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    z-index:5;color:rgba(236,252,255,.72);font-size:.62rem;letter-spacing:.42em;
    text-transform:uppercase;pointer-events:none;text-shadow:0 0 22px rgba(34,211,238,.75)
  }
  #mode{
    position:fixed;left:18px;bottom:16px;z-index:5;color:rgba(236,252,255,.52);
    font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;pointer-events:none
  }
  .label{
    color:#ecfeff;font-size:11px;font-weight:700;letter-spacing:.08em;text-align:center;
    text-shadow:0 0 8px rgba(0,0,0,.9),0 0 16px currentColor;white-space:nowrap;pointer-events:none
  }
  .bubble{
    max-width:250px;padding:8px 10px;border:2px solid currentColor;border-radius:9px;
    background:rgba(3,7,18,.88);font-size:10px;line-height:1.35;font-weight:800;
    color:#fff;box-shadow:0 0 20px currentColor;text-shadow:0 0 8px rgba(255,255,255,.55);
    pointer-events:none
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">Agent Habitat // Web3D</div>
<div id="mode">Click room to enter · click outside to overview</div>
<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050816);
scene.fog=new THREE.Fog(0x050816,18,42);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.35;
document.body.appendChild(renderer.domElement);

const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.position='fixed';
labelRenderer.domElement.style.inset='0';
labelRenderer.domElement.style.pointerEvents='none';
document.body.appendChild(labelRenderer.domElement);

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const clickableRooms=[];
const clock=new THREE.Clock();

const CONFIGS={
  hermes:{name:'Hermes',kind:'cat',color:0x00ff9d,shade:0x00a86b},
  claude:{name:'Claude Code',kind:'fox',color:0xff7a2f,shade:0xb83a12},
  codex:{name:'Codex',kind:'owl',color:0xb56cff,shade:0x6d28d9}
};
const FALLBACK_MESSAGES={
  hermes:['rastreando tareas','sincronizando memoria','olfateando logs','preparando ruta'],
  claude:['pensando respuesta','ordenando contexto','escribiendo plan','comparando opciones'],
  codex:['editando archivos','leyendo proyecto','probando cambios','revisando diffs']
};

const rooms=[
  {id:'kitchen',name:'Cocina',x:-3.05,z:-2.05,w:5.7,d:3.7,color:0x14b8a6,accent:0xf97316},
  {id:'lab',name:'Laboratorio',x:3.05,z:-2.05,w:5.7,d:3.7,color:0x8b5cf6,accent:0x22d3ee},
  {id:'lounge',name:'Salon',x:-3.05,z:2.05,w:5.7,d:3.7,color:0xf59e0b,accent:0x00ff9d},
  {id:'server',name:'Sala Servidor',x:3.05,z:2.05,w:5.7,d:3.7,color:0x2563eb,accent:0xff4fd8}
];
const roomById=Object.fromEntries(rooms.map(r=>[r.id,r]));
const roomLinks={
  kitchen:['lab','lounge'],
  lab:['kitchen','server'],
  lounge:['kitchen','server'],
  server:['lab','lounge']
};

let selectedRoom=null;
const cameraTarget={pos:new THREE.Vector3(0,10,10),look:new THREE.Vector3(0,0,0)};
const agents=new Map();
const interactionLines=[];

initLights();
buildHouse();
buildAppliances();
setOverview();
connect();
animate();

function initLights(){
  scene.add(new THREE.HemisphereLight(0xbbefff,0x1e1438,2.8));
  const key=new THREE.DirectionalLight(0xffffff,3.2);
  key.position.set(-5,10,7);key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  scene.add(key);
  const cyan=new THREE.PointLight(0x22d3ee,2.2,18);cyan.position.set(-4,3,-4);scene.add(cyan);
  const magenta=new THREE.PointLight(0xc084fc,1.8,18);magenta.position.set(4,3,4);scene.add(magenta);
}

function buildHouse(){
  const base=new THREE.Mesh(
    new THREE.BoxGeometry(12.8,.22,8.8),
    new THREE.MeshStandardMaterial({color:0x0f172a,roughness:.45,metalness:.1})
  );
  base.position.y=-.12;base.receiveShadow=true;scene.add(base);

  rooms.forEach(room=>{
    const floor=new THREE.Mesh(
      new THREE.BoxGeometry(room.w,.12,room.d),
      new THREE.MeshStandardMaterial({color:room.color,roughness:.48,metalness:.12,emissive:room.color,emissiveIntensity:.08})
    );
    floor.position.set(room.x,0,room.z);
    floor.userData.roomId=room.id;
    floor.receiveShadow=true;
    scene.add(floor);clickableRooms.push(floor);

    const grid=new THREE.GridHelper(Math.max(room.w,room.d),8,room.accent,0xffffff);
    grid.position.set(room.x,.07,room.z);grid.material.opacity=.18;grid.material.transparent=true;scene.add(grid);

    const plaque=makeTextLabel(room.name.toUpperCase(),'label',`#${room.accent.toString(16).padStart(6,'0')}`);
    plaque.position.set(room.x,.35,room.z-room.d*.36);scene.add(plaque);

    addRoomLight(room);
  });

  addWall(0,1.05,-4.4,12.8,.28,.35,0x1e293b);
  addWall(0,1.05,4.4,12.8,.28,.35,0x1e293b);
  addWall(-6.4,1.05,0,.28,.28,8.8,0x1e293b);
  addWall(6.4,1.05,0,.28,.28,8.8,0x1e293b);
  addWall(0,1.05,0,.24,.28,8.8,0x334155);
  addWall(0,1.05,0,12.8,.28,.24,0x334155);

  addDoorGlow(0,.15,-2.05,.18,1.25,0x22d3ee);
  addDoorGlow(0,.15,2.05,.18,1.25,0x22d3ee);
  addDoorGlow(-3.05,.15,0,1.25,.18,0xf97316);
  addDoorGlow(3.05,.15,0,1.25,.18,0xf97316);

  const roof=new THREE.Mesh(
    new THREE.ConeGeometry(7.9,2.3,4),
    new THREE.MeshStandardMaterial({color:0x7c2d12,roughness:.42,metalness:.05,emissive:0x431407,emissiveIntensity:.08})
  );
  roof.position.set(0,2.35,0);roof.rotation.y=Math.PI*.25;roof.castShadow=true;scene.add(roof);
  roof.visible=false;
}

function addWall(x,y,z,w,h,d,color){
  const wall=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.6,metalness:.08}));
  wall.position.set(x,y,z);wall.castShadow=true;wall.receiveShadow=true;scene.add(wall);
}
function addDoorGlow(x,y,z,w,d,color){
  const door=new THREE.Mesh(
    new THREE.BoxGeometry(w,.08,d),
    new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.85,transparent:true,opacity:.78})
  );
  door.position.set(x,y,z);scene.add(door);
}
function addRoomLight(room){
  const lamp=new THREE.PointLight(room.accent,1.8,6);
  lamp.position.set(room.x,2.3,room.z);scene.add(lamp);
}

function buildAppliances(){
  addAppliance('Nevera',-4.7,.45,-3.2,.75,.9,.55,0x67e8f9);
  addAppliance('Lavadora',-3.6,.42,-3.25,.7,.75,.55,0xa7f3d0,true);
  addAppliance('Horno',1.7,.42,-3.25,.85,.75,.55,0xf59e0b);
  addAppliance('Micro',2.9,.65,-3.25,.75,.45,.45,0xf472b6);
  addAppliance('Sofa',-4.2,.35,3.1,1.55,.55,.62,0xfb7185);
  addAppliance('Mesa',-2.7,.3,2.15,.9,.4,.9,0xfacc15);
  addAppliance('Rack',4.85,.65,3.1,.8,1.25,.55,0x60a5fa);
  addAppliance('Terminal',3.55,.55,1.6,1.15,.55,.45,0xa78bfa);
}
function addAppliance(label,x,y,z,w,h,d,color,round=false){
  const mat=new THREE.MeshStandardMaterial({color,roughness:.34,metalness:.25,emissive:color,emissiveIntensity:.08});
  const geo=round?new THREE.CylinderGeometry(w*.42,w*.42,h,32):new THREE.BoxGeometry(w,h,d);
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
  const light=new THREE.PointLight(color,.65,2.2);light.position.set(x,y+h*.8,z);scene.add(light);
  const tag=makeTextLabel(label.toUpperCase(),'label','#ecfeff');
  tag.position.set(x,y+h*.75,z);scene.add(tag);
}

class AgentPet{
  constructor(uid,agentId,idx){
    const cfg=CONFIGS[agentId];
    this.uid=uid;this.agentId=agentId;this.idx=idx;this.cfg=cfg;
    this.name=cfg.name+(idx?` #${idx+1}`:'');
    this.room=rooms[idx%rooms.length].id;
    this.targetRoom=this.room;
    this.phase='wander';
    this.pos=randomPointInRoom(this.room);
    this.target=this.pos.clone();
    this.velocity=new THREE.Vector3();
    this.status='idle';
    this.lastLine='';
    this.message=FALLBACK_MESSAGES[agentId][idx%FALLBACK_MESSAGES[agentId].length];
    this.messageTimer=2+Math.random()*4;
    this.group=buildPet(cfg.kind,cfg.color,cfg.shade);
    this.group.position.copy(this.pos);
    scene.add(this.group);
    this.nameLabel=makeTextLabel(this.name.toUpperCase(),'label',`#${cfg.color.toString(16).padStart(6,'0')}`);
    this.nameLabel.position.set(0,.92,0);this.group.add(this.nameLabel);
    this.bubble=makeTextLabel(this.message,'bubble',`#${cfg.color.toString(16).padStart(6,'0')}`);
    this.bubble.position.set(0,1.35,0);this.group.add(this.bubble);
  }
  setStatus(status,line){
    this.status=status;
    if(line&&line!==this.lastLine){
      this.lastLine=line;
      this.message=line.slice(0,130);
      this.setBubble(this.message);
      this.messageTimer=6;
    }
  }
  setBubble(text){this.bubble.element.textContent=text;}
  pickTarget(){
    if(Math.random()<.28){
      const options=roomLinks[this.room];
      this.targetRoom=options[Math.floor(Math.random()*options.length)];
      this.phase='toDoor';
      this.target=doorPoint(this.room,this.targetRoom);
      this.message=`voy a ${roomById[this.targetRoom].name.toLowerCase()}`;
      this.setBubble(this.message);
      return;
    }
    this.phase='wander';
    this.target=randomPointInRoom(this.room);
  }
  update(dt,all){
    this.messageTimer-=dt;
    if(this.messageTimer<0){
      const lines=FALLBACK_MESSAGES[this.agentId];
      this.message=lines[Math.floor(Math.random()*lines.length)];
      this.setBubble(this.message);
      this.messageTimer=4+Math.random()*6;
    }
    const dist=this.pos.distanceTo(this.target);
    if(dist<.18){
      if(this.phase==='toDoor'){
        this.room=this.targetRoom;
        this.phase='fromDoor';
        this.pos.copy(doorPoint(this.room,oppositeRoom(this.room)));
        this.target=randomPointInRoom(this.room);
      }else this.pickTarget();
    }
    const dir=this.target.clone().sub(this.pos);
    if(dir.lengthSq()>0) dir.normalize();
    const speed=this.status==='working'?1.45:this.status==='thinking'?.92:.62;
    this.velocity.lerp(dir.multiplyScalar(speed),Math.min(1,dt*2.2));

    for(const other of all){
      if(other===this||other.room!==this.room) continue;
      const away=this.pos.clone().sub(other.pos);
      const d=away.length();
      if(d>0&&d<.65) this.velocity.add(away.normalize().multiplyScalar((.65-d)*1.4));
      if(d>.65&&d<1.55&&this.status!=='idle'){
        this.message=`${other.name.split(' ')[0]}, tengo datos`;
        this.setBubble(this.message);
      }
    }

    this.pos.addScaledVector(this.velocity,dt);
    constrainToRoom(this);
    this.group.position.copy(this.pos);
    this.group.rotation.y=Math.atan2(this.velocity.x,this.velocity.z);
    const bob=Math.sin(performance.now()*.006+this.idx)*.06;
    this.group.position.y=.22+bob;
    this.group.scale.setScalar(this.status==='working'?1.12:1);
  }
}

function buildPet(kind,color,shade){
  const g=new THREE.Group();
  const bodyMat=new THREE.MeshStandardMaterial({color,roughness:.38,metalness:.12,emissive:color,emissiveIntensity:.08});
  const shadeMat=new THREE.MeshStandardMaterial({color:shade,roughness:.44,metalness:.08});
  const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35});
  const black=new THREE.MeshStandardMaterial({color:0x020617,roughness:.3});
  const yellow=new THREE.MeshStandardMaterial({color:0xfacc15,roughness:.35,emissive:0xf59e0b,emissiveIntensity:.12});

  const body=new THREE.Mesh(new THREE.SphereGeometry(.36,24,18),bodyMat);body.scale.set(1.05,.9,1.15);body.castShadow=true;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.31,24,18),bodyMat);head.position.set(0,.42,.18);head.castShadow=true;g.add(head);

  if(kind==='cat'||kind==='fox'){
    addEar(g,-.18,.74,.18,bodyMat);addEar(g,.18,.74,.18,bodyMat);
    const tail=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.55,8,16),bodyMat);
    tail.position.set(-.42,.2,-.2);tail.rotation.z=.95;tail.rotation.x=.6;tail.castShadow=true;g.add(tail);
    if(kind==='fox'){
      const chest=new THREE.Mesh(new THREE.SphereGeometry(.21,18,12),white);chest.position.set(0,.28,.43);chest.scale.set(.9,1,.35);g.add(chest);
      const tip=new THREE.Mesh(new THREE.SphereGeometry(.11,16,10),white);tip.position.set(-.65,.38,-.38);g.add(tip);
    }
  }else{
    addEar(g,-.18,.72,.18,bodyMat);addEar(g,.18,.72,.18,bodyMat);
    const wingL=new THREE.Mesh(new THREE.SphereGeometry(.2,16,10),shadeMat);wingL.position.set(-.34,.2,.03);wingL.scale.set(.45,1.15,.18);g.add(wingL);
    const wingR=wingL.clone();wingR.position.x=.34;g.add(wingR);
    const beak=new THREE.Mesh(new THREE.ConeGeometry(.08,.18,4),yellow);beak.position.set(0,.43,.5);beak.rotation.x=Math.PI*.5;g.add(beak);
  }

  [-.1,.1].forEach(x=>{
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,12,8),black);
    eye.position.set(x,.48,.48);g.add(eye);
    const shine=new THREE.Mesh(new THREE.SphereGeometry(.014,8,6),white);
    shine.position.set(x+.015,.495,.515);g.add(shine);
  });
  const nose=new THREE.Mesh(new THREE.SphereGeometry(.035,10,8),black);nose.position.set(0,.36,.51);g.add(nose);
  const glow=new THREE.PointLight(color,1.2,2.8);glow.position.set(0,.6,0);g.add(glow);
  return g;
}
function addEar(group,x,y,z,mat){
  const ear=new THREE.Mesh(new THREE.ConeGeometry(.11,.28,3),mat);
  ear.position.set(x,y,z);ear.rotation.x=.18;ear.castShadow=true;group.add(ear);
}

function makeTextLabel(text,cls,color){
  const el=document.createElement('div');
  el.className=cls;el.textContent=text;el.style.color=color;
  return new CSS2DObject(el);
}

function randomPointInRoom(roomId){
  const r=roomById[roomId];
  return new THREE.Vector3(
    r.x+(Math.random()-.5)*(r.w-1.1),
    .22,
    r.z+(Math.random()-.5)*(r.d-1.1)
  );
}
function constrainToRoom(agent){
  const r=roomById[agent.room],pad=.42;
  agent.pos.x=THREE.MathUtils.clamp(agent.pos.x,r.x-r.w*.5+pad,r.x+r.w*.5-pad);
  agent.pos.z=THREE.MathUtils.clamp(agent.pos.z,r.z-r.d*.5+pad,r.z+r.d*.5-pad);
}
function doorPoint(from,to){
  const a=roomById[from],b=roomById[to]||a;
  return new THREE.Vector3((a.x+b.x)/2,.22,(a.z+b.z)/2);
}
function oppositeRoom(roomId){
  return roomLinks[roomId]?.[0]||roomId;
}

function syncAgents(agentId,state){
  const needed=state.instances||1;
  const existing=[...agents.values()].filter(a=>a.agentId===agentId);
  for(let i=existing.length;i<needed;i++){
    const pet=new AgentPet(`${agentId}:${i}`,agentId,i);
    agents.set(pet.uid,pet);
  }
  for(let i=needed;i<existing.length;i++){
    scene.remove(existing[i].group);
    agents.delete(existing[i].uid);
  }
  for(let i=0;i<needed;i++){
    const pet=agents.get(`${agentId}:${i}`);
    if(pet) pet.setStatus(state.status,i===0?state.last_line:'');
  }
}
Object.keys(CONFIGS).forEach(id=>syncAgents(id,{status:'idle',last_line:'',instances:1}));

function updateInteractions(){
  interactionLines.forEach(l=>scene.remove(l));
  interactionLines.length=0;
  const list=[...agents.values()];
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
    const a=list[i],b=list[j];
    if(a.room!==b.room||a.pos.distanceTo(b.pos)>1.65) continue;
    const mat=new THREE.LineBasicMaterial({color:a.cfg.color,transparent:true,opacity:.65});
    const points=[a.pos.clone().add(new THREE.Vector3(0,.7,0)),b.pos.clone().add(new THREE.Vector3(0,.7,0))];
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),mat);
    scene.add(line);interactionLines.push(line);
  }
}

function setOverview(){
  selectedRoom=null;
  cameraTarget.pos.set(0,8.8,9.8);
  cameraTarget.look.set(0,0,0);
  document.getElementById('mode').textContent='Click room to enter · click outside to overview';
}
function enterRoom(room){
  selectedRoom=room.id;
  cameraTarget.pos.set(room.x,3.25,room.z+3.35);
  cameraTarget.look.set(room.x,.35,room.z);
  document.getElementById('mode').textContent=`Dentro de ${room.name} · click otra habitacion para moverte`;
}
function onClick(event){
  pointer.x=event.clientX/innerWidth*2-1;
  pointer.y=-(event.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hit=raycaster.intersectObjects(clickableRooms,false)[0];
  if(hit){
    enterRoom(roomById[hit.object.userData.roomId]);
  }else{
    setOverview();
  }
}
addEventListener('click',onClick);
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  labelRenderer.setSize(innerWidth,innerHeight);
});

function animate(){
  const dt=Math.min(.04,clock.getDelta());
  const list=[...agents.values()];
  list.forEach(a=>a.update(dt,list));
  updateInteractions();
  camera.position.lerp(cameraTarget.pos,.045);
  const look=new THREE.Vector3();
  camera.getWorldDirection(look);
  const current=camera.position.clone().add(look);
  current.lerp(cameraTarget.look,.075);
  camera.lookAt(current);
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
  requestAnimationFrame(animate);
}

function connect(){
  const ws=new WebSocket('ws://127.0.0.1:7788/ws');
  ws.onmessage=e=>{
    const data=JSON.parse(e.data);
    for(const[id,state]of Object.entries(data)) syncAgents(id,state);
  };
  ws.onclose=()=>setTimeout(connect,2000);
}
</script>
</body>
</html>
